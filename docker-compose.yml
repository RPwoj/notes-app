services:
  backend:
    build: backend
    user: "${UID}:${GID}"
    volumes:
      - /opt/notes-app/backend:/var/www/html

  nginx:
    image: nginx:latest
    volumes:
      - /opt/notes-app/backend:/var/www/html
      - /opt/notes-app/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80

  db:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notes
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
