services:
  frontend:
    build:
      context: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "3000"

  backend:
    build: backend
    user: "${UID}:${GID}"
    volumes:
      - /opt/notes-app/backend:/var/www/html

  nginx:
    image: nginx:latest
    depends_on:
      - backend
      - frontend
    volumes:
      - /opt/notes-app/backend:/var/www/html
      - /opt/notes-app/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80

  db:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-notes}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  frontend_node_modules:
